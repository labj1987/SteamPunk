[package]
name = "proton-trainer"
version = "0.1.0"
edition = "2021"
description = "Launch Windows game trainers through Proton against a running Steam game's wine session"
authors = ["Alex Brown"]

[[bin]]
name = "proton-trainer"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
