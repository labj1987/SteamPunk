[package]
name = "steampunk"
version = "0.3.0"
edition = "2021"
description = "Launch Windows game trainers through Proton against a running Steam game's wine session"
authors = ["Alex Brown"]

[[bin]]
name = "steampunk"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4", "v1_5"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
